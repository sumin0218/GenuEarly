<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>심층 분석 리포트 — GenuEarly</title>
    <!--
      **인라인 스크립트와 인라인 스타일을 쓰지 않는다.**
      MV3 의 기본 CSP 가 막고, 막지 않더라도 주입된 글이 코드가 되는 길을 하나 더 만든다
      (docs/security/secure-coding.md 4절).

      이 페이지의 내용은 전부 `main.ts` 가 **DOM 으로** 만든다. 마크업 문자열을 넣지 않는다 —
      기사 본문 인용과 바깥에서 찾아온 기록이 함께 올라가는 화면이다.
    -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="ge-report">
      <header class="ge-report__bar">
        <img class="ge-report__logo" alt="" width="20" height="20" hidden />
        <span class="ge-report__brand">GenuEarly</span>
        <span class="ge-report__kind">심층 분석 리포트</span>
        <span class="ge-report__spacer"></span>
        <!-- 신고는 아직 자리만 둔다 (GE-26). 누르면 아무것도 보내지 않는다 -->
        <button type="button" id="report-wrong" class="ge-report__ghost">잘못된 정보 제보</button>
        <!--
          보관함 여는 단추. 막대 셋은 **CSS 로 그린다** — lib/icon-data.ts 는 Reicon
          생성물이라 손대지 않고, 막대 셋은 path 데이터가 필요한 모양도 아니다.
          이름은 main.ts 가 packages/content 에서 넣는다 (여기 적으면 두 곳이 된다).
        -->
        <button type="button" id="archive-toggle" class="ge-report__menu" aria-expanded="false" aria-controls="archive">
          <span class="ge-report__bars" aria-hidden="true"></span>
        </button>
      </header>

      <main id="body" class="ge-report__body">
        <!-- main.ts 가 채운다 -->
      </main>
    </div>

    <!--
      지난 리포트 보관함. **오른쪽에서 열리는 서랍이다.**

      `.ge-report` 바깥에 둔다 — 읽기 폭(760px)에 갇히면 안 되고, 본문을 덮는 막과
      형제여야 겹치는 순서가 분명해진다.

      `#body` 와도 떨어져 있다. 지금 보고 있는 리포트가 없어도 (브라우저를 다시 켠 뒤
      등) 목록은 열려야 하기 때문이다. 내용은 main.ts 가 채우고, 닫혀 있을 때는
      `hidden` 이라 탭 순서에도 없다.
    -->
    <div id="archive-scrim" class="ge-archive__scrim" hidden></div>
    <aside id="archive" class="ge-archive" aria-labelledby="archive-title" hidden></aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
