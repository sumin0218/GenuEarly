name: 판단 결과 이의
description: 표시된 배지나 경고가 잘못됐다고 생각될 때 알려 주세요.
title: "[판단 이의] "
labels: ["판단 이의", "외부 제보"]
body:
  - type: markdown
    attributes:
      value: |
        GenuEarly는 기사가 진짜인지 가짜인지 단정하지 않습니다.
        '주의가 필요한 신호'가 있는지를 알려 줄 뿐이고, 그 판단도 틀릴 수 있습니다.
        어디가 어떻게 틀렸는지 알려 주시면 판단 기준을 고치는 데 씁니다.

        **먼저 읽어 주세요.**
        - 이 저장소는 누구나 볼 수 있는 공개 저장소입니다.
        - **개인정보를 적지 말아 주세요.**
        - **기사 본문 전체를 붙여 넣지 말아 주세요.** 기사 주소와 근거가 된 문장 한두 개면 충분합니다.

  - type: input
    id: article-url
    attributes:
      label: 기사 주소
      placeholder: https://...
    validations:
      required: true

  - type: dropdown
    id: shown
    attributes:
      label: 화면에 표시된 결과
      options:
        - 🟢 안심
        - 🟡 확인 권장
        - 🔴 주의
        - ⚪ 판단 보류
        - 낚시성 제목 표시 (포털 목록)
        - 공유 직전 알림
    validations:
      required: true

  - type: dropdown
    id: expected
    attributes:
      label: 어떤 결과가 맞다고 보시나요
      options:
        - 🟢 안심
        - 🟡 확인 권장
        - 🔴 주의
        - ⚪ 판단 보류
        - 아무 표시도 뜨지 않아야 한다
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 그렇게 보시는 이유
      description: 근거가 된 문장이 있다면 한두 줄만 인용해 주세요. 본문 전체는 넣지 말아 주세요.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 확장 프로그램 버전
      placeholder: 1.0.0
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 확인
      options:
        - label: 개인정보와 기사 본문 전체를 넣지 않았습니다.
          required: true
