name: PR Assignee

# 담당자 검사만 따로 둔다. `Lint PR` 에 붙이면 담당자를 넣고 뺄 때마다
# 확장·중계·공용 테스트까지 다시 돌아 빌드가 통째로 낭비된다.
#
# 트리거에 들어 있어야 하는 것 둘.
#
# - `assigned`·`unassigned` — 담당자를 넣은 뒤에 검사가 저절로 다시 돌아 초록으로
#   바뀐다. 없으면 사람이 빈 커밋을 밀어야 한다.
# - `synchronize` — 브랜치 보호는 **그 커밋에 달린** check run 을 본다. 커밋을 밀
#   때마다 돌지 않으면 새 SHA 에 이 검사가 없어서 PR 이 "Expected" 로 영구히 막힌다.
#
# 그래서 매 push 마다 돈다. 체크아웃과 셸 두 줄이라 몇 초면 끝난다 — 이 검사를
# `Lint PR` 에 붙이지 않고 따로 둔 이유가 이것이다.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, assigned, unassigned]

permissions:
  contents: read

# 담당자를 여러 번 넣고 빼면 run 이 쌓인다. 같은 PR 의 앞선 run 은 취소한다.
# 이미 끝난 run 은 취소되지 않아서, 담당자 없이 연 PR 에는 실패한 run 이 남는다.
# 브랜치 보호는 **이름이 같은 check run 중 가장 나중 것**을 보므로 머지는 막히지 않는다.
concurrency:
  group: pr-assignee-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assignee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 담당자 규칙 테스트
        run: bash .github/scripts/test-validate-assignee.sh
      # 아이디를 env 로 넘긴다. 식을 run 안에 바로 펼치면 아이디가 셸 코드로 읽힌다.
      # GitHub 식에는 length() 가 없어서 개수를 세지 않고 목록을 그대로 본다.
      - name: 담당자 검사
        env:
          ASSIGNEES: ${{ join(github.event.pull_request.assignees.*.login, ' ') }}
        run: bash .github/scripts/validate-assignee.sh "$ASSIGNEES"
