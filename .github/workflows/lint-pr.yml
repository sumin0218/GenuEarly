name: Lint PR

# squash merge에서는 PR 제목이 그대로 커밋 메시지가 된다 — 그래서 여기가 히스토리의 관문이다.
# 로컬 commit-msg 훅은 편의라서 설치하지 않은 사람도 막지 않는다.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 커밋 메시지 검사는 루트의 commitlint 만 쓴다. 워크스페이스까지 설치하면
      # wrangler·workerd 내려받기가 실패할 때 제목 검사까지 막힌다.
      - name: 메시지 규칙 설치
        run: npm ci --workspaces=false
      # 규칙 자체를 검사한다. 오타 하나로 type-enum이 비어도 모든 제목이 통과하는 일을 막는다.
      - name: 메시지 규칙 테스트
        run: npm run test:commitlint
      - name: PR 제목 검사
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx --no -- commitlint

  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Jira 연결은 브랜치 이름이 한다. 키가 빠지면 이슈에 아무것도 남지 않으므로 여기서 막는다.
      - name: 브랜치 이름 규칙 테스트
        run: bash .github/scripts/test-validate-branch-name.sh
      - name: 출발 브랜치 이름 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/validate-branch-name.sh "$HEAD_REF"

  pr-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 출발 브랜치 규칙 테스트
        run: bash .github/scripts/test-validate-pr-source.sh
      - name: main 대상 PR 출발 브랜치 검사
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/validate-pr-source.sh "$BASE_REF" "$HEAD_REF"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 설치
        run: npm ci -w @genuearly/extension --include-workspace-root
      # 권한 규칙은 문서에만 적어 두면 지켜지지 않는다.
      # 이 검사가 빌드된 manifest 를 읽어 금지 권한과 와일드카드 호스트를 막는다.
      - name: 확장 프로그램 테스트 (빌드 포함)
        run: npm test -w @genuearly/extension
      - name: 수동 테스트 기사 생성·선택 버튼 검사
        run: |
          node eval/fixtures/manual-news/build.cjs
          node eval/fixtures/manual-news/verify.mjs
          git diff --exit-code -- eval/fixtures/manual-news

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 설치
        run: npm ci -w @genuearly/proxy --include-workspace-root
      # 중계 서버는 키를 가진 유일한 곳이다. 출처 검증과 CORS 규칙이 살아 있는지 본다.
      - name: 중계 서버 테스트
        run: npm test -w @genuearly/proxy
      - name: 타입 검사
        run: npm run compile -w @genuearly/proxy

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 설치
        run: npm ci -w @genuearly/shared --include-workspace-root
      # 점수 합산과 단계 결정은 모델 없이 고정 응답으로 검사한다.
      # 가중치·임계값 표가 judgment-items.json 의 항목과 어긋나는 것도 여기서 막는다.
      - name: 점수 규칙 테스트
        run: npm test -w @genuearly/shared
      - name: 타입 검사
        run: npm run compile -w @genuearly/shared
