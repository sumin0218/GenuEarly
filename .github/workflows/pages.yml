name: Pages

# 랜딩 페이지를 GitHub Pages 로 올린다 → https://sumin0218.github.io/GenuEarly/
#
# **`landing/` 만 올린다.** `docs/` 를 쓰지 않는 이유는 그 폴더가 이미 설계·보안·제출
# 서류로 차 있기 때문이다. 저장소 구조를 건드리지 않으려고 Actions 로 올린다.
#
# **`landing/` 이 바뀔 때만 돈다.** 문서만 고쳐도 배포가 돌면 로그가 지저분해지고,
# 무엇이 언제 올라갔는지 알 수 없게 된다.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  # 손으로도 돌릴 수 있게 둔다. 사진을 넣고 바로 올려 보고 싶을 때가 있다.
  workflow_dispatch:

# 읽기만 하고, Pages 에 쓸 권한과 신원 토큰만 더한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 중에 또 올리지 않는다. **진행 중인 것을 끊지는 않는다** — 반쯤 올라간
# 사이트가 남는 것보다 한 번 더 기다리는 쪽이 낫다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing
      - id: deploy
        uses: actions/deploy-pages@v4
